name: golangci-lint
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  # only-new-issues reads the pull request's diff through the API.
  pull-requests: read

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.3
          cache: false
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # The same release `make lint` builds. version-file needs the
          # default binary install mode; that release's binary must be built
          # with a Go at least as new as go.mod's language version, or
          # golangci-lint refuses to load the config.
          version-file: .golangci-lint-version

          # Fail only on issues in the lines this pull request or push changes.
          # For a push the action diffs the push's before and after commits, so
          # every commit in a multi-commit push is covered. The tree has older
          # issues; `make lint-all` lists them.
          only-new-issues: true

          args: --timeout=5m --config=.golangci.yaml

  # Lint does not see vulnerabilities in dependencies; this does. It fails on
  # any advisory the code can actually reach, so a module bump that stays
  # unreachable does not break the build.
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.3
          cache: false
      # Pinned rather than "latest" so the gate cannot start failing (or pass)
      # because the tool changed. Bump deliberately.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
