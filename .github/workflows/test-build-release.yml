name: Test, Build, maybe Release
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  Test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tdiscuss
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Cache Bazel
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Bazel's output base differs by OS: ~/.cache/bazel on Linux,
          # /private/var/tmp/_bazel_<user> on macOS.
          path: |
            ${{ runner.os == 'macOS' && '/private/var/tmp/_bazel_runner' || '~/.cache/bazel' }}
            ~/.cache/bazel-disk
          key: ${{ runner.os }}-bazel-${{ hashFiles('.bazelversion', '.bazelrc', 'MODULE.bazel', 'MODULE.bazel.lock') }}
          restore-keys: |
            ${{ runner.os }}-bazel-
      - name: Go version check
        run: make check-go-versions
      - name: Test //...
        run: bazelisk test --config=ci --build_tests_only --workspace_status_command="${PWD}/status.sh" //...

  Build:
    needs: Test
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          # Linux binaries are pure Go and build on Linux runners.
          - { goos: linux, goarch: amd64, runner: ubuntu-latest }
          - { goos: linux, goarch: arm64, runner: ubuntu-latest }
          # darwin is cgo (tailscale certstore links Apple frameworks) and must
          # build natively on a macOS runner. Apple Silicon only: Intel macOS is
          # being retired by Apple and GitHub (macos-13 is already gone).
          - { goos: darwin, goarch: arm64, runner: macos-latest }
    steps:
      - name: Check out tdiscuss
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Cache Bazel
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Bazel's output base differs by OS: ~/.cache/bazel on Linux,
          # /private/var/tmp/_bazel_<user> on macOS.
          path: |
            ${{ runner.os == 'macOS' && '/private/var/tmp/_bazel_runner' || '~/.cache/bazel' }}
            ~/.cache/bazel-disk
          key: ${{ runner.os }}-bazel-${{ hashFiles('.bazelversion', '.bazelrc', 'MODULE.bazel', 'MODULE.bazel.lock') }}
          restore-keys: |
            ${{ runner.os }}-bazel-
      - name: Build //:tdiscuss-${{ matrix.goos }}-${{ matrix.goarch }}
        run: |
          bazelisk build --config=ci --stamp --workspace_status_command="${PWD}/status.sh" //:tdiscuss-${{ matrix.goos }}-${{ matrix.goarch }}
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tdiscuss-${{ matrix.goos }}-${{ matrix.goarch }}
          path: bazel-bin/tdiscuss-${{ matrix.goos }}-${{ matrix.goarch }}_/tdiscuss-${{ matrix.goos }}-${{ matrix.goarch }}

  Release:
    needs: Build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
    - name: Set pre-release flag
      id: release_type
      env:
        REF: ${{ github.ref }}
      run: |
        if [[ "$REF" == *beta* ]]; then
          echo "type=pre-release" >> "$GITHUB_OUTPUT"
        else
          echo "type=release" >> "$GITHUB_OUTPUT"
        fi
    - name: Download artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
    - name: Create Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        if [[ "${{ steps.release_type.outputs.type }}" == "pre-release" ]]; then
          gh release create ${GITHUB_REF#refs/tags/} \
            --title "Release ${GITHUB_REF#refs/tags/}" \
            --prerelease \
            --generate-notes
        else
          gh release create ${GITHUB_REF#refs/tags/} \
            --title "Release ${GITHUB_REF#refs/tags/}" \
            --generate-notes
        fi
    - name: Upload Release Assets
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        for artifact in tdiscuss-*; do
          gh release upload ${GITHUB_REF#refs/tags/} $artifact/$artifact
        done
