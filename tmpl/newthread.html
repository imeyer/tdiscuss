{{ template "header" .}}

<h1 class="page-title">New thread</h1>

<!-- nosemgrep: python.django.security.django-no-csrf-token.django-no-csrf-token -- Go html/template, not Django; CSRF handled in middleware -->
<form action="/thread/new" method="POST">
    <div class="form-group">
        <label for="subject">subject</label>
        <input type="text" id="subject" name="subject" required>
    </div>
    <div class="form-group">
        <label for="thread_body">body <a href="/formatting" class="form-help-link">formatting help</a></label>
        <textarea id="thread_body" name="thread_body" rows="10" required></textarea>
    </div>
    <div class="form-group">
        <button type="submit">Post it!</button>
    </div>
</form>

{{ template "footer" .}}
