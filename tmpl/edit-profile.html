{{ template "header" . }}

{{ if .Member }}
<h1 class="page-title">Editing profile for {{ .User.Email }}</h1>

<!-- nosemgrep: python.django.security.django-no-csrf-token.django-no-csrf-token -- Go html/template, not Django; CSRF handled in middleware -->
<form action="/member/edit" method="POST">
    <div class="form-group">
        <label for="photo_url">Photo URL</label>
        <input type="url" id="photo_url" name="photo_url" value="{{ .Member.PhotoUrl.String }}">
    </div>
    <div class="form-group">
        <label for="location">Location</label>
        <input type="text" id="location" name="location" value="{{ .Member.Location.String }}">
    </div>
    <div class="form-group">
        <label for="pronouns">Pronouns</label>
        <input type="text" id="pronouns" name="pronouns" value="{{ .Member.Pronouns.String }}">
    </div>
    <div class="form-group">
        <label for="preferred_name">Preferred Name</label>
        <input type="text" id="preferred_name" name="preferred_name" value="{{ .Member.PreferredName.String }}">
    </div>
    <div class="form-group">
        <label for="bio">Bio</label>
        <textarea id="bio" name="bio" rows="10">{{ .Member.Bio.String }}</textarea>
    </div>
    <div class="form-group">
        <button type="submit">Update Profile</button>
    </div>
</form>

<a href="/member/{{ .Member.ID }}" class="back-link">Back to profile</a>
{{ else }}
<h1 class="page-title">No member here...</h1>
{{ end }}

{{ template "footer" . }}
