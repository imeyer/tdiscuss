{{define "header"}}
<!DOCTYPE html>
<html lang="en">

<head>
    <title>{{ .Title }}</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/style.css?v={{ .Version }}">
    <script src="/static/theme.js?v={{ .Version }}"></script>
</head>

<body>
    <div id="container">
        <header id="header">
            <div class="header-bar">
                <h1 class="board-title"><a href="/">{{ .Title }}</a></h1>
                <div class="theme-switcher">
                    <button class="theme-btn" data-theme="auto" title="Match system" aria-label="Match system theme">🌓</button>
                    <button class="theme-btn" data-theme="soft-rose" title="Soft Rose" aria-label="Soft Rose theme">🌸</button>
                    <button class="theme-btn" data-theme="twilight-sakura" title="Twilight Sakura" aria-label="Twilight Sakura theme">🌙</button>
                </div>
            </div>
            {{ template "menu" . }}
        </header>
        <main id="main">
    {{end}}
