{{ template "header" . }}

{{ if .Thread }}
<h1 class="page-title">Editing thread</h1>

<!-- nosemgrep: python.django.security.django-no-csrf-token.django-no-csrf-token -- Go html/template, not Django; CSRF handled in middleware -->
<form action="/thread/{{ .Thread.ThreadID }}/edit" method="POST">
    <input type="hidden" name="thread_post_id" value="{{ .Thread.ThreadPostID }}">
    <div class="form-group">
        <label for="subject">subject</label>
        <input type="text" id="subject" name="subject" required value="{{ .Thread.Subject }}">
    </div>
    <div class="form-group">
        <label for="thread_body">body <a href="/formatting" class="form-help-link">formatting help</a></label>
        <textarea id="thread_body" name="thread_body" rows="10" required>{{ .Thread.Body.String }}</textarea>
    </div>
    <div class="form-group">
        <button type="submit">Update it!</button>
    </div>
</form>

<a href="/thread/{{ .Thread.ThreadID }}" class="back-link">Back to thread</a>
{{ else }}
<h1 class="page-title">No thread here...</h1>
{{ end }}

{{ template "footer" . }}
