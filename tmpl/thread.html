{{ template "header" . }}

<h1 class="subject">{{ .Subject }}</h1>

{{ range .ThreadPosts }}
<article class="threadpost-bubble" id="post-{{ .ID }}">
    <div class="threadpost-header">
        <span>
            <a href="/member/{{ .MemberID.Int64 }}">{{ .Email.String }}</a>
            on {{ .DatePosted.Time | formatTimestamp }}
        </span>
        <span class="threadpost-actions">
            {{ if .CanEdit.Bool }}<a href="/thread/{{ .ThreadID.Int64 }}/{{ .ID }}/edit">edit</a>{{ end }}
            <a href="#post-{{ .ID }}" class="permalink">#{{ .ID }}</a>
        </span>
    </div>
    <div class="threadpost-body">
        {{ .Body }}
    </div>
</article>
{{ end }}

<!-- nosemgrep: python.django.security.django-no-csrf-token.django-no-csrf-token -- Go html/template, not Django; CSRF handled in middleware -->
<form action="/thread/{{ .ID }}" method="POST">
    <div class="form-group">
        <label for="thread_body">reply <a href="/formatting" class="form-help-link">formatting help</a></label>
        <textarea id="thread_body" name="thread_body" rows="10" required></textarea>
    </div>
    <div class="form-group">
        <button type="submit">Post it!</button>
    </div>
</form>

{{ template "footer" . }}
